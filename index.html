<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DONE — Todo App</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --c1: #ff3d6b;
    --c2: #ffcc00;
    --c3: #00e5ff;
    --c4: #b36bff;
    --c5: #00e676;
    --bg: #0a0a0f;
    --bg2: #111118;
    --bg3: #1a1a24;
    --surface: #1e1e2e;
    --border: rgba(255,255,255,0.08);
    --text: #f0f0ff;
    --text2: rgba(240,240,255,0.5);
    --text3: rgba(240,240,255,0.25);
    --radius: 16px;
    --transition: 0.2s cubic-bezier(.4,0,.2,1);
  }
  [data-theme="light"] {
    --bg: #f5f5fb;
    --bg2: #eeeef8;
    --bg3: #e5e5f2;
    --surface: #ffffff;
    --border: rgba(0,0,0,0.08);
    --text: #0a0a1a;
    --text2: rgba(10,10,26,0.5);
    --text3: rgba(10,10,26,0.25);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 1rem 4rem;
    transition: background var(--transition), color var(--transition);
    position: relative;
    overflow-x: hidden;
  }

  /* Background decoration */
  body::before {
    content: '';
    position: fixed;
    top: -200px; right: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(255,61,107,0.08) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -200px; left: -100px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(0,229,255,0.06) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }

  .wrap {
    max-width: 680px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* Header */
  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 2.5rem 0 2rem;
    gap: 1rem;
  }
  .header-left {}
  .app-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3.5rem, 10vw, 5.5rem);
    line-height: 0.85;
    letter-spacing: 0.02em;
    background: linear-gradient(135deg, var(--c1), var(--c2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .app-tagline {
    font-size: 0.8rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text2);
    margin-top: 0.3rem;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 0.5rem;
  }
  .icon-btn {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
    transition: background var(--transition), transform var(--transition);
    color: var(--text);
  }
  .icon-btn:hover { background: var(--bg3); transform: scale(1.05); }
  .icon-btn:active { transform: scale(0.96); }

  /* Stats bar */
  .stats-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 1.5rem;
  }
  .stat {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.9rem 1rem;
    text-align: center;
    transition: background var(--transition);
  }
  .stat-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    line-height: 1;
  }
  .stat-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text2);
    margin-top: 2px;
  }
  .stat:nth-child(1) .stat-num { color: var(--c3); }
  .stat:nth-child(2) .stat-num { color: var(--c5); }
  .stat:nth-child(3) .stat-num { color: var(--c1); }

  /* Add task form */
  .add-form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 1.2rem;
    margin-bottom: 1.2rem;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .add-row {
    display: flex;
    gap: 10px;
    align-items: stretch;
    flex-wrap: wrap;
  }
  .task-input {
    flex: 1;
    min-width: 0;
    width: 100%;
    background: var(--bg2);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 0.85rem 1rem;
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: border-color var(--transition);
  }
  .task-input::placeholder { color: var(--text3); }
  .task-input:focus { border-color: var(--c1); }
  .bottom-row {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }
  .date-input {
    flex: 1;
    min-width: 0;
    background: var(--bg2);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 0.85rem 1rem;
    color: var(--text2);
    font-family: 'Outfit', sans-serif;
    font-size: 0.85rem;
    outline: none;
    cursor: pointer;
    transition: border-color var(--transition);
  }
  .date-input:focus { border-color: var(--c2); }
  .date-input::-webkit-calendar-picker-indicator { filter: invert(0.5); cursor: pointer; }
  .add-btn {
    background: linear-gradient(135deg, var(--c1), #ff6b35);
    border: none;
    border-radius: 12px;
    padding: 0.85rem 1.4rem;
    color: #fff;
    font-family: 'Outfit', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform var(--transition), opacity var(--transition);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .add-btn:hover { transform: scale(1.03); }
  .add-btn:active { transform: scale(0.97); opacity: 0.9; }

  /* Desktop: single row layout */
  @media (min-width: 520px) {
    .add-row { flex-wrap: nowrap; }
    .bottom-row { display: contents; }
    .date-input { width: 150px; flex: 0 0 150px; }
  }

  /* Search & filter */
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 1.2rem;
    flex-wrap: wrap;
  }
  .search-box {
    flex: 1;
    min-width: 160px;
    position: relative;
  }
  .search-icon {
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    color: var(--text3);
    font-size: 0.9rem;
    pointer-events: none;
  }
  .search-input {
    width: 100%;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 0.8rem 1rem 0.8rem 2.4rem;
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-size: 0.9rem;
    outline: none;
    transition: border-color var(--transition);
  }
  .search-input::placeholder { color: var(--text3); }
  .search-input:focus { border-color: var(--c3); }

  .filter-tabs {
    display: flex;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 5px;
  }
  .filter-tab {
    padding: 0.45rem 0.9rem;
    border-radius: 8px;
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    color: var(--text2);
    transition: background var(--transition), color var(--transition);
    border: none;
    background: none;
    font-family: 'Outfit', sans-serif;
  }
  .filter-tab.active {
    background: var(--c1);
    color: #fff;
  }
  .filter-tab:not(.active):hover { background: var(--bg3); color: var(--text); }

  /* Sort */
  .sort-select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.8rem 1rem;
    color: var(--text2);
    font-family: 'Outfit', sans-serif;
    font-size: 0.82rem;
    outline: none;
    cursor: pointer;
  }

  /* Task list */
  .task-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .empty-state {
    text-align: center;
    padding: 4rem 1rem;
    display: none;
  }
  .empty-state.visible { display: block; }
  .empty-emoji { font-size: 3.5rem; margin-bottom: 1rem; }
  .empty-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem;
    color: var(--text2);
    letter-spacing: 0.05em;
  }
  .empty-sub { font-size: 0.85rem; color: var(--text3); margin-top: 0.4rem; }

  /* Task item */
  .task-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.1rem;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: transform var(--transition), opacity var(--transition), border-color var(--transition);
    animation: taskIn 0.3s cubic-bezier(.4,0,.2,1);
    position: relative;
    overflow: hidden;
  }
  .task-item::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent-color, var(--c3));
    border-radius: 3px 0 0 3px;
  }
  @keyframes taskIn {
    from { opacity: 0; transform: translateY(-10px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .task-item:hover { border-color: rgba(255,255,255,0.14); transform: translateX(2px); }
  .task-item.done { opacity: 0.45; }
  .task-item.done .task-text { text-decoration: line-through; color: var(--text2); }

  /* Checkbox */
  .check-wrap {
    flex-shrink: 0;
    width: 24px; height: 24px;
    cursor: pointer;
  }
  .check-wrap input { display: none; }
  .check-box {
    width: 24px; height: 24px;
    border-radius: 7px;
    border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    transition: background var(--transition), border-color var(--transition), transform var(--transition);
    font-size: 0.75rem;
    color: #fff;
  }
  .check-wrap input:checked + .check-box {
    background: var(--c5);
    border-color: var(--c5);
  }
  .check-box:hover { border-color: var(--c5); transform: scale(1.1); }

  /* Task content */
  .task-body { flex: 1; min-width: 0; }
  .task-text {
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color var(--transition);
  }
  .task-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
    flex-wrap: wrap;
  }
  .due-badge {
    font-size: 0.72rem;
    padding: 2px 8px;
    border-radius: 100px;
    font-weight: 500;
  }
  .due-badge.future { background: rgba(0,229,255,0.12); color: var(--c3); }
  .due-badge.today { background: rgba(255,204,0,0.15); color: var(--c2); }
  .due-badge.overdue { background: rgba(255,61,107,0.15); color: var(--c1); }
  .due-badge.done-badge { background: rgba(0,230,118,0.12); color: var(--c5); }

  /* Delete btn */
  .del-btn {
    flex-shrink: 0;
    width: 34px; height: 34px;
    border-radius: 10px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text3);
    font-size: 1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--transition), color var(--transition), border-color var(--transition);
  }
  .del-btn:hover {
    background: rgba(255,61,107,0.12);
    border-color: rgba(255,61,107,0.3);
    color: var(--c1);
  }

  /* Accent colors for tasks */
  .task-item[data-accent="0"]::before { background: var(--c1); }
  .task-item[data-accent="1"]::before { background: var(--c2); }
  .task-item[data-accent="2"]::before { background: var(--c3); }
  .task-item[data-accent="3"]::before { background: var(--c4); }
  .task-item[data-accent="4"]::before { background: var(--c5); }

  /* Footer */
  .footer {
    text-align: center;
    margin-top: 3rem;
    font-size: 0.72rem;
    color: var(--text3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* Clear completed button */
  .clear-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.5rem 1rem;
    color: var(--text2);
    font-family: 'Outfit', sans-serif;
    font-size: 0.8rem;
    cursor: pointer;
    transition: background var(--transition), color var(--transition);
    display: none;
  }
  .clear-btn.visible { display: inline-block; }
  .clear-btn:hover { background: rgba(255,61,107,0.1); color: var(--c1); border-color: rgba(255,61,107,0.3); }

  .list-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.8rem;
  }
  .list-count {
    font-size: 0.78rem;
    color: var(--text3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* Overdue highlight on task */
  .task-item.overdue-task { border-color: rgba(255,61,107,0.2); }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="header-left">
      <div class="app-name">DONE.</div>
      <div class="app-tagline">Your tasks. Conquered.</div>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="themeBtn" title="Toggle theme">🌙</button>
    </div>
  </header>

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat">
      <div class="stat-num" id="totalCount">0</div>
      <div class="stat-label">Total</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="doneCount">0</div>
      <div class="stat-label">Done</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="overdueCount">0</div>
      <div class="stat-label">Overdue</div>
    </div>
  </div>

  <!-- Add form -->
  <div class="add-form">
    <div class="add-row">
      <input class="task-input" id="taskInput" type="text" placeholder="What needs to be done?" maxlength="120" />
      <div class="bottom-row">
        <input class="date-input" id="dateInput" type="date" />
        <button class="add-btn" onclick="addTask()">+ Add</button>
      </div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="searchInput" type="text" placeholder="Search tasks…" oninput="renderTasks()" />
    </div>
    <div class="filter-tabs">
      <button class="filter-tab active" data-filter="all" onclick="setFilter('all',this)">All</button>
      <button class="filter-tab" data-filter="active" onclick="setFilter('active',this)">Active</button>
      <button class="filter-tab" data-filter="done" onclick="setFilter('done',this)">Done</button>
    </div>
    <select class="sort-select" id="sortSelect" onchange="renderTasks()">
      <option value="newest">Newest</option>
      <option value="oldest">Oldest</option>
      <option value="due">Due date</option>
      <option value="alpha">A → Z</option>
    </select>
  </div>

  <!-- Task list -->
  <div class="list-header">
    <span class="list-count" id="listCount"></span>
    <button class="clear-btn" id="clearBtn" onclick="clearCompleted()">Clear completed</button>
  </div>

  <div class="task-list" id="taskList"></div>

  <div class="empty-state" id="emptyState">
    <div class="empty-emoji">✦</div>
    <div class="empty-title">All clear!</div>
    <div class="empty-sub">Add a task above to get started</div>
  </div>

  <div class="footer">DONE · Stay productive · Built with ❤️</div>
</div>

<script>
  let tasks = JSON.parse(localStorage.getItem('done_tasks') || '[]');
  let currentFilter = 'all';
  let accentIndex = 0;
  const ACCENTS = 5;

  function save() {
    localStorage.setItem('done_tasks', JSON.stringify(tasks));
  }

  function getDateStatus(dateStr, done) {
    if (done) return { label: '✓ Done', cls: 'done-badge' };
    if (!dateStr) return null;
    const today = new Date(); today.setHours(0,0,0,0);
    const due = new Date(dateStr + 'T00:00:00');
    if (due < today) return { label: `Overdue · ${fmt(dateStr)}`, cls: 'overdue' };
    if (due.getTime() === today.getTime()) return { label: 'Due today', cls: 'today' };
    return { label: `Due ${fmt(dateStr)}`, cls: 'future' };
  }

  function fmt(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  }

  function addTask() {
    const text = document.getElementById('taskInput').value.trim();
    if (!text) { document.getElementById('taskInput').focus(); return; }
    const date = document.getElementById('dateInput').value;
    tasks.unshift({
      id: Date.now(),
      text,
      date: date || '',
      done: false,
      accent: accentIndex % ACCENTS,
      created: Date.now()
    });
    accentIndex++;
    document.getElementById('taskInput').value = '';
    document.getElementById('dateInput').value = '';
    save();
    renderTasks();
    document.getElementById('taskInput').focus();
  }

  function toggleTask(id) {
    const t = tasks.find(t => t.id === id);
    if (t) { t.done = !t.done; save(); renderTasks(); }
  }

  function deleteTask(id) {
    const el = document.querySelector(`[data-id="${id}"]`);
    if (el) {
      el.style.transition = '0.25s ease';
      el.style.opacity = '0';
      el.style.transform = 'translateX(30px) scale(0.95)';
      setTimeout(() => {
        tasks = tasks.filter(t => t.id !== id);
        save(); renderTasks();
      }, 230);
    }
  }

  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTasks();
  }

  function clearCompleted() {
    tasks = tasks.filter(t => !t.done);
    save(); renderTasks();
  }

  function renderTasks() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const sort = document.getElementById('sortSelect').value;
    const today = new Date(); today.setHours(0,0,0,0);

    let filtered = tasks.filter(t => {
      if (currentFilter === 'active' && t.done) return false;
      if (currentFilter === 'done' && !t.done) return false;
      if (search && !t.text.toLowerCase().includes(search)) return false;
      return true;
    });

    filtered.sort((a, b) => {
      if (sort === 'oldest') return a.created - b.created;
      if (sort === 'newest') return b.created - a.created;
      if (sort === 'alpha') return a.text.localeCompare(b.text);
      if (sort === 'due') {
        if (!a.date && !b.date) return 0;
        if (!a.date) return 1;
        if (!b.date) return -1;
        return a.date.localeCompare(b.date);
      }
      return 0;
    });

    const list = document.getElementById('taskList');
    const empty = document.getElementById('emptyState');
    list.innerHTML = '';

    const total = tasks.length;
    const done = tasks.filter(t => t.done).length;
    const overdue = tasks.filter(t => {
      if (t.done || !t.date) return false;
      return new Date(t.date + 'T00:00:00') < today;
    }).length;

    document.getElementById('totalCount').textContent = total;
    document.getElementById('doneCount').textContent = done;
    document.getElementById('overdueCount').textContent = overdue;
    document.getElementById('listCount').textContent =
      filtered.length === 0 ? '' : `${filtered.length} task${filtered.length !== 1 ? 's' : ''}`;

    const clearBtn = document.getElementById('clearBtn');
    clearBtn.classList.toggle('visible', done > 0);

    if (filtered.length === 0) {
      empty.classList.add('visible');
      const isSearch = search.length > 0;
      empty.querySelector('.empty-emoji').textContent = isSearch ? '🔍' : (tasks.length === 0 ? '✦' : '🎉');
      empty.querySelector('.empty-title').textContent = isSearch ? 'No matches' : (tasks.length === 0 ? 'All clear!' : 'Nothing here');
      empty.querySelector('.empty-sub').textContent = isSearch
        ? 'Try a different search term'
        : (tasks.length === 0 ? 'Add a task above to get started' : 'Switch filters to see tasks');
      return;
    }
    empty.classList.remove('visible');

    filtered.forEach(t => {
      const status = getDateStatus(t.date, t.done);
      const isOverdue = t.date && !t.done && new Date(t.date + 'T00:00:00') < today;

      const item = document.createElement('div');
      item.className = `task-item${t.done ? ' done' : ''}${isOverdue ? ' overdue-task' : ''}`;
      item.dataset.id = t.id;
      item.dataset.accent = t.accent;

      item.innerHTML = `
        <label class="check-wrap">
          <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${t.id})" />
          <div class="check-box">${t.done ? '✓' : ''}</div>
        </label>
        <div class="task-body">
          <div class="task-text">${escHtml(t.text)}</div>
          <div class="task-meta">
            ${status ? `<span class="due-badge ${status.cls}">${status.label}</span>` : ''}
          </div>
        </div>
        <button class="del-btn" onclick="deleteTask(${t.id})" title="Delete">✕</button>
      `;
      list.appendChild(item);
    });
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Theme toggle
  const themeBtn = document.getElementById('themeBtn');
  let isDark = true;
  themeBtn.addEventListener('click', () => {
    isDark = !isDark;
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    themeBtn.textContent = isDark ? '🌙' : '☀️';
  });

  // Enter to add
  document.getElementById('taskInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask();
  });

  // Set default date to today
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('dateInput').setAttribute('min', today);

  renderTasks();
</script>
</body>
</html>
